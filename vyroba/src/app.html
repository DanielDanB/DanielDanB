<title>Přehled zakázek</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --steel-050:#f3f5f6; --steel-100:#e7eaec; --steel-200:#d5dade; --steel-300:#b9c1c7;
  --bg:#eef1f2; --surface:#ffffff; --surface-2:#f7f9f9; --line:#d7dee1; --line-soft:#e6ebed;
  --ink:#14191c; --ink-2:#3d4a51; --muted:#6b7a82;
  --accent:#0f4c5c; --accent-soft:#dceaef; --accent-ink:#0b3a46;
  --ok:#2e7d4f; --ok-soft:#dcf0e4; --warn:#9a6b06; --warn-soft:#fdf0d2;
  --bad:#b3352c; --bad-soft:#fbe0dd; --info:#2b6ca3; --info-soft:#dceaf7;
  --g1:#e2f0d9; --g2:#c6e0b4; --g3:#a9d18e; --g4:#70ad47; --g5:#548235; --g6:#38761d; --g7:#274e13;
  --a-fill:#ddebf7; --a-end:#0f4c5c; --a-late:#e06666;
  --shadow:0 1px 2px rgba(16,32,38,.06),0 8px 24px -12px rgba(16,32,38,.24);
  --radius:6px;
  --fs-xs:11px; --fs-sm:12.5px; --fs-md:14px; --fs-lg:17px; --fs-xl:22px; --fs-xxl:30px;
}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1416; --surface:#151d20; --surface-2:#1a2427; --line:#2a3639; --line-soft:#222d30;
    --ink:#e8eef0; --ink-2:#b7c4c8; --muted:#87979d;
    --accent:#59b6ce; --accent-soft:#12333d; --accent-ink:#a9dbe8;
    --ok:#5fc98a; --ok-soft:#11301f; --warn:#e0ac3c; --warn-soft:#332608;
    --bad:#f0817a; --bad-soft:#3a1613; --info:#6fb0e6; --info-soft:#10283c;
    --g1:#25401c; --g2:#2f5223; --g3:#3d6a2d; --g4:#4d8639; --g5:#5c9d44; --g6:#6fb552; --g7:#8ccf6d;
    --a-fill:#173248; --a-end:#59b6ce; --a-late:#c8524a;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --bg:#0e1416; --surface:#151d20; --surface-2:#1a2427; --line:#2a3639; --line-soft:#222d30;
  --ink:#e8eef0; --ink-2:#b7c4c8; --muted:#87979d;
  --accent:#59b6ce; --accent-soft:#12333d; --accent-ink:#a9dbe8;
  --ok:#5fc98a; --ok-soft:#11301f; --warn:#e0ac3c; --warn-soft:#332608;
  --bad:#f0817a; --bad-soft:#3a1613; --info:#6fb0e6; --info-soft:#10283c;
  --g1:#25401c; --g2:#2f5223; --g3:#3d6a2d; --g4:#4d8639; --g5:#5c9d44; --g6:#6fb552; --g7:#8ccf6d;
  --a-fill:#173248; --a-end:#59b6ce; --a-late:#c8524a;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 var(--fs-md)/1.45 "IBM Plex Sans","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.eyebrow{font-family:"IBM Plex Sans Condensed","IBM Plex Sans",sans-serif;font-size:var(--fs-xs);font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:206px 1fr;min-height:100vh}
.rail{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:16px 16px 12px;border-bottom:1px solid var(--line-soft)}
.brand b{display:block;font-family:"IBM Plex Sans Condensed",sans-serif;font-size:var(--fs-lg);font-weight:700;letter-spacing:-.01em}
.brand span{display:block;font-size:var(--fs-xs);color:var(--muted);letter-spacing:.04em}
.nav{padding:10px 8px;display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:9px;width:100%;padding:7px 9px;background:none;border:0;border-radius:var(--radius);text-align:left;color:var(--ink-2);cursor:pointer;font-size:var(--fs-sm);font-weight:500}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button[aria-current="true"]{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.nav .ico{width:15px;height:15px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6}
.nav .cnt{margin-left:auto;font-size:var(--fs-xs);color:var(--muted);font-family:"IBM Plex Mono",monospace}
.rail-foot{margin-top:auto;padding:10px;border-top:1px solid var(--line-soft);display:flex;flex-direction:column;gap:6px}
.rail-foot .src{font-size:var(--fs-xs);color:var(--muted);line-height:1.35}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--line);padding:10px 18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.topbar h1{margin:0;font-family:"IBM Plex Sans Condensed",sans-serif;font-size:var(--fs-xl);font-weight:700;letter-spacing:-.015em}
.topbar .sub{font-size:var(--fs-sm);color:var(--muted)}
.spacer{flex:1 1 auto}
.content{padding:18px;display:flex;flex-direction:column;gap:16px}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border:1px solid var(--line);background:var(--surface);border-radius:var(--radius);cursor:pointer;font-size:var(--fs-sm);font-weight:500;color:var(--ink-2)}
.btn:hover{border-color:var(--steel-300);color:var(--ink);background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
:root[data-theme="dark"] .btn.primary,:root:not([data-theme="light"]) .btn.primary{color:#08181d}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]) .btn.primary{color:#fff}}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--bad);border-color:var(--line)}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
.field{display:flex;flex-direction:column;gap:3px}
.field label{font-size:var(--fs-xs);font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
input,select,textarea{padding:6px 8px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);font-size:var(--fs-sm);min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
.search{position:relative;flex:0 1 300px}
.search input{width:100%;padding-left:28px}
.search svg{position:absolute;left:8px;top:50%;transform:translateY(-50%);width:14px;height:14px;stroke:var(--muted);fill:none;stroke-width:1.8}
.filters{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;box-shadow:var(--shadow)}

/* ---------- panels ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.panel-head{display:flex;align-items:baseline;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line-soft)}
.panel-head h2{margin:0;font-size:var(--fs-md);font-weight:600}
.panel-head .hint{font-size:var(--fs-xs);color:var(--muted)}
.panel-body{padding:14px}

/* ---------- KPI ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;display:flex;flex-direction:column;gap:2px;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
.kpi.is-bad::before{background:var(--bad)} .kpi.is-ok::before{background:var(--ok)} .kpi.is-warn::before{background:var(--warn)}
.kpi .v{font-family:"IBM Plex Mono",monospace;font-size:var(--fs-xxl);font-weight:600;line-height:1.1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi .k{font-size:var(--fs-xs);font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.kpi .d{font-size:var(--fs-xs);color:var(--muted)}

/* ---------- table ---------- */
.tablewrap{overflow:auto;max-height:calc(100vh - 260px)}
table.grid{border-collapse:separate;border-spacing:0;width:100%;font-size:var(--fs-sm)}
table.grid th{position:sticky;top:0;z-index:2;background:var(--surface-2);border-bottom:1px solid var(--line);padding:7px 9px;text-align:left;white-space:nowrap;font-family:"IBM Plex Sans Condensed",sans-serif;font-size:var(--fs-xs);font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);cursor:pointer;user-select:none}
table.grid th:hover{color:var(--ink)}
table.grid th .arr{opacity:.45;font-size:9px}
table.grid td{padding:6px 9px;border-bottom:1px solid var(--line-soft);vertical-align:top}
table.grid tbody tr:hover td{background:var(--surface-2)}
table.grid tbody tr{cursor:pointer}
td.nm{max-width:340px;font-weight:500}
td.mono,th.mono{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;white-space:nowrap}
.empty{padding:36px;text-align:center;color:var(--muted);font-size:var(--fs-sm)}

.pill{display:inline-flex;align-items:center;gap:5px;padding:1px 7px;border-radius:999px;font-size:var(--fs-xs);font-weight:600;white-space:nowrap;border:1px solid transparent}
.pill .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.s-Hotovo{background:var(--ok-soft);color:var(--ok)}
.s-Výroba{background:var(--info-soft);color:var(--info)}
.s-Design,.s-Schvalování,.s-Příprava{background:var(--warn-soft);color:var(--warn)}
.s-Zrušeno{background:var(--steel-100);color:var(--muted);text-decoration:line-through}
.s-Ostatní,.s-Nezadáno{background:var(--surface-2);color:var(--muted);border-color:var(--line)}
.tag{display:inline-block;padding:1px 6px;border-radius:3px;font-size:var(--fs-xs);font-weight:600;border:1px solid var(--line);color:var(--ink-2);background:var(--surface-2)}
.tag.obrobna{background:var(--accent-soft);color:var(--accent-ink);border-color:transparent}
.tag.svarovna{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.late{color:var(--bad);font-weight:600}
.ontime{color:var(--ok)}
.prio{display:inline-block;min-width:18px;text-align:center;border-radius:3px;font-weight:700;font-size:var(--fs-xs);padding:1px 4px}
.p1{background:var(--bad-soft);color:var(--bad)} .p2{background:var(--warn-soft);color:var(--warn)}
.p3{background:var(--info-soft);color:var(--info)} .p4{background:var(--steel-100);color:var(--muted)}
:root[data-theme="dark"] .p4,:root:not([data-theme="light"]) .p4{background:var(--surface-2)}

/* ---------- gantt ---------- */
.gantt{overflow:auto;max-height:calc(100vh - 250px)}
table.gantt-t{border-collapse:separate;border-spacing:0;font-size:var(--fs-xs)}
table.gantt-t th,table.gantt-t td{border-bottom:1px solid var(--line-soft);border-right:1px solid var(--line-soft)}
table.gantt-t thead th{position:sticky;top:0;z-index:3;background:var(--surface-2);padding:4px 5px;font-family:"IBM Plex Mono",monospace;font-weight:500;color:var(--muted);text-align:center;white-space:nowrap}
table.gantt-t thead th.head-lbl{z-index:5;text-align:left;font-family:"IBM Plex Sans Condensed",sans-serif;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.gc-lbl{position:sticky;left:0;z-index:2;background:var(--surface);padding:3px 8px;white-space:nowrap;max-width:300px;overflow:hidden;text-overflow:ellipsis}
.gc-code{position:sticky;left:300px;z-index:2;background:var(--surface);padding:3px 8px;font-family:"IBM Plex Mono",monospace;white-space:nowrap}
.gc-row{position:sticky;left:404px;z-index:2;background:var(--surface);padding:3px 8px;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
tr:hover .gc-lbl,tr:hover .gc-code,tr:hover .gc-row{background:var(--surface-2)}
.day{width:19px;min-width:19px;height:17px;padding:0}
.wknd{background:var(--surface-2)}
.today{box-shadow:inset 0 0 0 1px var(--warn)}
.ph1{background:var(--g1)} .ph2{background:var(--g2)} .ph3{background:var(--g3)} .ph4{background:var(--g4)} .ph5{background:var(--g5)}
.mst{background:var(--g6)} .fin{background:var(--g7)}
.act{background:var(--a-fill)} .actend{background:var(--a-end)} .actlate{background:var(--a-late)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:var(--fs-xs);color:var(--muted);padding:8px 14px;border-top:1px solid var(--line-soft)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:14px;height:11px;border-radius:2px;display:inline-block;border:1px solid rgba(0,0,0,.08)}

/* ---------- kanban ---------- */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(240px,1fr);gap:10px;overflow-x:auto;padding-bottom:6px;align-items:start}
.col{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);display:flex;flex-direction:column;min-height:120px}
.col > header{padding:9px 11px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;gap:7px;font-size:var(--fs-sm);font-weight:600}
.col > header .n{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:var(--fs-xs);color:var(--muted)}
.col .stack{padding:8px;display:flex;flex-direction:column;gap:7px;min-height:60px;max-height:calc(100vh - 300px);overflow:auto}
.col.drop{background:var(--accent-soft)}
.card{border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:4px;padding:7px 9px;background:var(--surface-2);cursor:grab;display:flex;flex-direction:column;gap:3px}
.card.od{border-left-color:var(--bad)}
.card .t{font-size:var(--fs-sm);font-weight:500;line-height:1.3}
.card .m{display:flex;gap:7px;align-items:center;font-size:var(--fs-xs);color:var(--muted);font-family:"IBM Plex Mono",monospace;flex-wrap:wrap}
.card.dragging{opacity:.4}

/* ---------- charts ---------- */
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:16px}
.bars{display:flex;flex-direction:column;gap:7px}
.bar-row{display:grid;grid-template-columns:132px 1fr 52px;gap:9px;align-items:center;font-size:var(--fs-sm)}
.bar-row .lb{color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{background:var(--surface-2);border-radius:3px;height:15px;overflow:hidden;border:1px solid var(--line-soft)}
.bar-fill{height:100%;background:var(--accent);border-radius:2px 0 0 2px}
.bar-row .vl{text-align:right;font-family:"IBM Plex Mono",monospace;font-size:var(--fs-xs);color:var(--muted)}
.stackbar{display:flex;height:22px;border-radius:4px;overflow:hidden;border:1px solid var(--line-soft)}
.stackbar div{display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff}

/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,20,24,.42);z-index:50;display:flex;justify-content:flex-end}
.drawer{width:min(560px,100%);background:var(--surface);height:100%;overflow:auto;box-shadow:-20px 0 50px -20px rgba(0,0,0,.4);display:flex;flex-direction:column}
.drawer > header{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--line);padding:14px 18px;display:flex;align-items:flex-start;gap:10px;z-index:2}
.drawer h2{margin:0;font-size:var(--fs-lg);font-weight:600;line-height:1.25}
.drawer .body{padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.drawer footer{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:12px 18px;display:flex;gap:8px}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.formgrid .full{grid-column:1/-1}
.timeline{display:flex;flex-direction:column;gap:0;border-left:2px solid var(--line);margin-left:6px;padding-left:14px}
.tl{position:relative;padding:6px 0;font-size:var(--fs-sm)}
.tl::before{content:"";position:absolute;left:-21px;top:11px;width:9px;height:9px;border-radius:50%;background:var(--line);border:2px solid var(--surface)}
.tl.done::before{background:var(--accent)}
.tl .lb{font-size:var(--fs-xs);color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.tl .dt{font-family:"IBM Plex Mono",monospace}
.note{font-size:var(--fs-sm);color:var(--muted);line-height:1.5}
.dictlist{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 5px 3px 10px;font-size:var(--fs-sm);background:var(--surface-2)}
.chip button{border:0;background:none;cursor:pointer;color:var(--muted);line-height:1;padding:2px 4px;border-radius:50%}
.chip button:hover{color:var(--bad);background:var(--bad-soft)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:var(--fs-sm);font-weight:500;z-index:100;box-shadow:var(--shadow)}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .rail{position:static;height:auto;flex-direction:row;align-items:center;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}
  .brand{border:0;padding:10px 14px} .nav{flex-direction:row;padding:6px} .nav .cnt{display:none} .rail-foot{display:none}
  .formgrid{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app">
  <aside class="rail">
    <div class="brand"><b>Přehled zakázek</b><span>Obrobna &middot; Svařovna</span></div>
    <nav class="nav" id="nav"></nav>
    <div class="rail-foot">
      <button class="btn ghost" id="themeBtn" style="justify-content:flex-start">◐ Motiv</button>
      <p class="src" id="srcInfo"></p>
    </div>
  </aside>
  <div class="main">
    <header class="topbar">
      <h1 id="viewTitle">Přehled</h1>
      <span class="sub" id="viewSub"></span>
      <span class="spacer"></span>
      <div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="Hledat zakázku, objednávku, číslo…"></div>
      <select id="yearSel" title="Rok"></select>
      <button class="btn primary" id="newBtn">+ Nová zakázka</button>
    </header>
    <div class="content" id="content"></div>
  </div>
</div>
<div id="overlay"></div>
<script id="seed" type="application/json">__DATA__</script>
<script>
__APP__
</script>
